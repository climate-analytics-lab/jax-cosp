[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-cosp"
version = "0.1.0"
description = "Differentiable satellite simulators in JAX: a translation of the CFMIP Observation Simulator Package (COSP v2), starting with the CloudSat/Quickbeam radar path"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "The jax-cosp Authors" },
]
keywords = ["COSP", "satellite simulator", "CloudSat", "radar", "JAX", "differentiable", "climate model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[tool.setuptools.packages.find]
include = ["jcosp*"]

[tool.setuptools.package-data]
"jcosp" = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["jcosp"]
python_files = ["*_test.py"]
markers = [
    "slow: marks tests taking more than ~1 minute (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # missing docstrings
    "E731",  # lambda assignment
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
